name: Moodle Plugin CI

"on": [push, pull_request]

jobs:
  # Moodle 5.0 / 5.1 on PHP 8.2+, mirroring the matrix that local_adele tests against.
  moodle500to501:
    uses: Wunderbyte-GmbH/catalyst-moodle-workflows/.github/workflows/ci.yml@main
    with:
      disable_release: true

      moodle_branches: "MOODLE_500_STABLE MOODLE_501_STABLE"
      min_php: '8.2'

      # enrol_adele declares a hard dependency on local_adele, and local_adele in
      # turn declares one on mod_adele, so both have to be present before this
      # plugin can install at all.
      #
      # All three plugins are co-developed on a shared "development" working
      # branch per repo (Session 001, Teil 4).
      # Companion plugins come from the Wunderbyte upstream, deliberately.
      # Note the inconsistent naming that this has to match exactly:
      # local uses an underscore (moodle_local_adele) on branch "main",
      # mod uses a hyphen on branch "master", enrol a hyphen on "main".
      #
      # PREREQUISITE: this only works once the corresponding changes are
      # merged upstream. version.php declares hard dependencies on specific
      # sibling versions, so an upstream that is behind makes Moodle refuse
      # to install with "Dependencies check failed" - before a single test
      # runs. If that happens, the branches here are ahead of upstream, not
      # the code broken.
      extra_plugin_runners: |
        moodle-plugin-ci add-plugin --branch main Wunderbyte-GmbH/moodle_local_adele
        moodle-plugin-ci add-plugin --branch master Wunderbyte-GmbH/moodle-mod_adele

      # local_adele ships a Vue3 build tree; this plugin does not, so there is
      # nothing here for grunt to do.
      disable_grunt: true

      enable_phpmd: true

      # No warnings tolerated. Keep it that way.
      codechecker_max_warnings: 0

  # Floor: Moodle 4.5 on PHP 8.1.
  #
  # NOT 4.1, even though $plugin->requires still names 2022112800. This plugin
  # alone would run on 4.1, but the job installs mod_adele, which requires
  # 2024100700 — so on MOODLE_401_STABLE the site cannot be installed and the
  # job fails before reaching a single test. $plugin->supported is [405, 502]
  # for exactly that reason.
  moodle405:
    uses: Wunderbyte-GmbH/catalyst-moodle-workflows/.github/workflows/ci.yml@main
    with:
      disable_release: true

      moodle_branches: "MOODLE_405_STABLE"
      min_php: '8.1'

      # Companion plugins come from the Wunderbyte upstream, deliberately.
      # Note the inconsistent naming that this has to match exactly:
      # local uses an underscore (moodle_local_adele) on branch "main",
      # mod uses a hyphen on branch "master", enrol a hyphen on "main".
      #
      # PREREQUISITE: this only works once the corresponding changes are
      # merged upstream. version.php declares hard dependencies on specific
      # sibling versions, so an upstream that is behind makes Moodle refuse
      # to install with "Dependencies check failed" - before a single test
      # runs. If that happens, the branches here are ahead of upstream, not
      # the code broken.
      extra_plugin_runners: |
        moodle-plugin-ci add-plugin --branch main Wunderbyte-GmbH/moodle_local_adele
        moodle-plugin-ci add-plugin --branch master Wunderbyte-GmbH/moodle-mod_adele

      disable_grunt: true

      enable_phpmd: true

      codechecker_max_warnings: 0
